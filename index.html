<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vida &Oacute;ptima &mdash; Bioqu&iacute;mica Nutricional y Longevidad</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="legalModal" class="modal" style="display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.95); z-index:9999; position:fixed; top:0; left:0; width:100%; height:100%;">
  <div class="modal-content" style="max-width:500px; padding:30px; background:#111; color:#fff; border:1px solid #333; text-align:center;">
    <h2 style="color:#00f3ff;">Aviso Legal</h2>
    <p style="font-size:14px; margin:20px 0;">Al usar esta plataforma, aceptas nuestros t&eacute;rminos de bienestar y privacidad.</p>
    <button class="btn-primary" onclick="acceptLegal()" style="width:100%; padding:15px; cursor:pointer;">Aceptar y Continuar</button>
  </div>
</div>

<section id="landing">
  <nav class="top-nav" style="display:flex; justify-content:space-between; padding:20px;">
    <div class="logo" style="font-weight:900; font-size:24px;">VIDA <span style="color:#00f3ff;">&Oacute;PTIMA</span></div>
    <div style="font-size:12px; color:#666;">Sistema de Bienestar</div>
  </nav>
  <div class="landing-content" style="text-align:center; padding:100px 20px;">
    <h1 style="font-size:60px; line-height:1.1;">Vive <span class="gradient-text">100 a&ntilde;os</span><br>con prop&oacute;sito.</h1>
    <p style="font-size:18px; color:#aaa; margin:20px 0;">Asistente inteligente de salud y longevidad.</p>
    <button id="mainStartBtn" class="btn-primary" onclick="startOnboarding()" style="padding:20px 40px; font-size:18px; font-weight:bold; cursor:pointer; background:#00f3ff; color:#000; border:none; border-radius:50px;">Comenzar mi plan gratuito &rarr;</button>
  </div>
</section>

<section id="onboarding" class="hidden">
  <div class="onboarding-wrap" style="max-width:600px; margin:0 auto; padding:50px 20px;">
    <div id="step1" class="step active">
      <h2>Paso 1: Tu Perfil</h2>
      <div class="form-grid" style="display:grid; gap:20px; margin-top:30px;">
        <input type="text" id="nombre" placeholder="Tu nombre" style="padding:15px; background:#222; border:1px solid #333; color:#fff;">
        <input type="number" id="edad" placeholder="Edad" style="padding:15px; background:#222; border:1px solid #333; color:#fff;">
        <button class="btn-next" onclick="nextStep(2)" style="padding:15px; background:#00f3ff; color:#000; font-weight:bold; border:none; cursor:pointer;">Siguiente &rarr;</button>
      </div>
    </div>
    <div id="step2" class="step">
      <h2>Paso 2: Salud</h2>
      <p>Procesando datos biom&eacute;tricos...</p>
      <button class="btn-next" onclick="nextStep(3)">Siguiente</button>
    </div>
    <div id="step6" class="step">
      <h2>Plan Listo</h2>
      <div id="summaryCard"></div>
      <button class="btn-primary" onclick="generatePlan(true)">Ver mi Plan</button>
    </div>
  </div>
</section>

<section id="dashboard" class="hidden">
  <div id="dashContent"></div>
</section>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="engine.js"></script>
<script src="modules.js"></script>
<script src="app_v3.js"></script>
</body>
</html>
